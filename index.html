<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نتائج دفعة 2029</title>
    <style>
        body {
            background-color: #0b3d66; /* لون كحلي مثل الصورة */
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 20px;
        }
        .header-box {
            text-align: center;
            border-bottom: 2px solid #4ea8de;
            margin-bottom: 30px;
            padding-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: rgba(255, 255, 255, 0.05);
        }
        th {
            background-color: #1a5276;
            color: #add8e6;
            padding: 15px;
            border-bottom: 1px solid #4ea8de;
        }
        td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid rgba(78, 168, 222, 0.2);
        }
        tr:nth-child(even) { background-color: rgba(255, 255, 255, 0.02); }
        .btn-detail {
            background-color: white;
            color: #0b3d66;
            border: none;
            padding: 5px 10px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
        }
        .sort-menu {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        select, button {
            padding: 8px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div class="header-box">
        <h1>نتائج أسماء الأوائل - دفعة 2029</h1>
    </div>

    <form action="/sort" method="post" class="sort-menu">
        <select name="column_index">
            <option value="10">معدل السنة الثانية</option>
            <option value="11">معدل السنة الثالثة</option>
            <option value="15">مجموع الفصل</option>
        </select>
        <button type="submit">فرز الآن</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>الترتيب</th>
                <th>رقم الاكتتاب</th>
                <th>الاسم الثلاثي</th>
                <th>اسم الأم</th>
                <th>النتيجة ({{ col_name if col_name else 'الدرجة' }})</th>
                <th>التفاصيل</th>
            </tr>
        </thead>
        <tbody>
            {% for row in results %}
            <tr>
                <td>{{ loop.index }}</td>
                <td>{{ row[0] }}</td> <td>{{ row[5] }}</td> <td>{{ row[6] }}</td> <td><strong>{{ row[sorted_col] }}</strong></td>
                <td><a href="/student/{{ row[0] }}" class="btn-detail">⬅</a></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
